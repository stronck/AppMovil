<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aplicación web para organizar tareas personales.">
  <title>Mis tareas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <p class="eyebrow">ORGANIZACIÓN PERSONAL</p>
      <h1>Mis tareas</h1>
      <p class="subtitle">Organiza tus pendientes y registra lo que ya terminaste.</p>
    </header>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Agregar una tarea</h2>
      <form id="task-form">
        <label for="task-title">Título de la tarea</label>
        <div class="form-row">
          <input id="task-title" name="title" type="text" maxlength="200"
                 placeholder="Ej. Entregar actividad" autocomplete="off" required>
          <button type="submit">Agregar</button>
        </div>
        <p id="form-message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="tasks-section" aria-labelledby="tasks-title">
      <div class="section-heading">
        <h2 id="tasks-title">Tu lista</h2>
        <span id="task-count" class="count">0 tareas</span>
      </div>
      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state">Todavía no hay tareas. ¡Agrega la primera!</p>
      <p id="load-error" class="message error" role="alert" hidden></p>
    </section>

    <footer><span>Los datos se guardan en la base de datos SQLite del servidor.</span></footer>
  </main>
</body>
</html>
